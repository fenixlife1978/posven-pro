name: Temporary Corte X-Z Typecheck
on:
  push:
    branches:
      - fix/corte-x-z-arqueo-mainline
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
